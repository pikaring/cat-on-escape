<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ねこを にがせ</title>
<meta name="description" content="ねこの かおを すべらせて 3びき そろえ、ねこを にがす おちもの パズル">
<meta name="theme-color" content="#2f5d3a">

<!-- ホーム画面に くわえた ときの アイコンと なまえ -->
<link rel="icon" type="image/png" sizes="32x32" href="images/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
<link rel="apple-touch-icon" href="images/icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ねこにがせ">

<link rel="stylesheet" href="style.css">
<link rel="canonical" href="https://pikaring.github.io/cat-on-escape/app/">
</head>
<body>

  <!-- ===== ヘッダー：スコアと メッセージ ===== -->
  <header class="header">
    <div class="status">
      <span class="status__label">スコア</span>
      <span class="status__value" id="score">0</span>
      <span class="status__level" id="level">レベル 1</span>
      <span class="status__level status__moves" id="moves">のこり 20て</span>
      <span class="status__level" id="best">さいこう 0</span>
    </div>

    <!-- クリアまで（にがした ねこの かず） -->
    <div class="gauge" aria-hidden="true">
      <div class="gauge__bar" id="gaugeBar"></div>
    </div>
    <p class="quota" id="quota">あと 24ひき にがすと クリア</p>

    <p class="message" id="message" role="status" aria-live="polite">よこか たてに 3びき そろえるニャ！</p>
  </header>

  <!-- ===== メインビュー：ねこの ばん ===== -->
  <main class="board-area" id="boardArea">
    <div class="board" id="board" role="grid" aria-label="ねこの ばん"></div>

    <!-- 「きょうは ここまで」の あとの おやすみ がめん -->
    <div class="rest" id="rest" hidden>
      <div class="rest__panel">
        <p class="rest__icon" aria-hidden="true">😴</p>
        <p class="rest__text" id="restText"></p>
        <button type="button" class="btn btn--kind" id="btnRestart">
          <span class="btn__text">つづきから あそぶ</span>
        </button>
      </div>
    </div>
  </main>

  <!-- ===== したの おおきな ボタン ===== -->
  <footer class="actions">
    <button type="button" class="btn btn--again" id="btnReset">
      <span class="btn__icon" aria-hidden="true">🔄</span>
      <span class="btn__text">やりなおす</span>
    </button>
    <button type="button" class="btn btn--kind" id="btnKind">
      <span class="btn__icon" aria-hidden="true">🐾</span>
      <span class="btn__text">むずかしさ</span>
      <span class="btn__sub" id="kindSub">ふつう</span>
    </button>
  </footer>

  <!-- ===== ねこの かずを えらぶ がめん ===== -->
  <div class="modal" id="kindModal" hidden>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="kindTitle">

      <h2 class="modal__title" id="kindTitle">むずかしさを えらぶ</h2>

      <div class="cat-choices" id="kindChoices"></div>

      <p class="modal__note">むずかしさごとに すすんだ レベルを おぼえています</p>

      <button type="button" class="btn btn--again btn--wide" id="btnLevelOne">
        <span class="btn__text">レベル 1 から あそぶ</span>
      </button>

      <button type="button" class="btn btn--close" id="btnCloseKind">
        <span class="btn__text">とじる</span>
      </button>

    </div>
  </div>

  <!-- ===== レベルの おわり（クリア／て が なくなった） ===== -->
  <div class="modal" id="endModal" hidden>
    <div class="modal__panel modal__panel--end" role="dialog" aria-modal="true" aria-labelledby="endTitle">

      <h2 class="modal__title" id="endTitle">レベル 1 クリア！</h2>
      <p class="end__stars" id="endStars" aria-label="ほし">★★★</p>
      <p class="end__text" id="endText"></p>

      <div class="end__actions">
        <button type="button" class="btn btn--kind" id="btnEndNext">
          <span class="btn__text" id="endNextText">つぎの レベルへ</span>
        </button>
        <button type="button" class="btn btn--close" id="btnEndRest">
          <span class="btn__text">きょうは ここまで</span>
        </button>
      </div>

    </div>
  </div>

  <!-- ===== そろった ねこが 画面の 右へ はしって いく ところ ===== -->
  <div class="runway" id="runway" aria-hidden="true"></div>

  <!-- ===== 「2れんさ！」などの おおきな おしらせ ===== -->
  <div class="bignews" id="bignews" hidden aria-hidden="true">
    <p class="bignews__text" id="bignewsText"></p>
  </div>

<script src="main.js"></script>
</body>
</html>
